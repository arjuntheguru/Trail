# Local development database. Production uses the shared MySQL 8.4 server.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: trail-root-dev
      MYSQL_DATABASE: trail
      MYSQL_USER: trail
      MYSQL_PASSWORD: trail-dev
    ports:
      - "3317:3306"
    volumes:
      - trail-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptrail-root-dev"]
      interval: 5s
      retries: 20

volumes:
  trail-mysql:
