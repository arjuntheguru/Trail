# Local development database. Production uses the shared MySQL 8.4 server.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: trail-root-dev
      MYSQL_DATABASE: trail
      MYSQL_USER: trail
      MYSQL_PASSWORD: trail-dev
    ports:
      - "3317:3306"
    volumes:
      - trail-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptrail-root-dev"]
      interval: 5s
      retries: 20

  # Optional containerised API: docker compose --profile app up -d --build
  # Runs in Production mode. The image has no curl/wget, so there is no container healthcheck;
  # probe http://localhost:8080/health/live from outside.
  api:
    profiles: ["app"]
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Http__HttpsRedirection: "false"
      Database__ConnectionString: "Server=mysql;Port=3306;Database=trail;User=trail;Password=trail-dev"
      Database__MigrateOnStartup: "true"
      Jwt__SigningKey: "local-dev-only-signing-key-change-me-0123456789"
      # Production rejects localhost frontend URLs; links in the emails caught by mailpit point here.
      App__FrontendBaseUrl: "https://trail.example.test"
      Cors__AllowedOrigins__0: "https://localhost:5173"
      Email__Provider: Smtp
      Email__SmtpHost: mailpit
      Email__SmtpPort: "1025"
      Storage__Provider: S3
      Storage__S3__Bucket: trail
      Storage__S3__ServiceUrl: http://minio:9000
      Storage__S3__AllowInsecureServiceUrl: "true" # dev only: MinIO is plain http inside the compose network
      Storage__S3__ForcePathStyle: "true"
      Storage__S3__Region: us-east-1
      Storage__S3__AccessKeyId: trail-dev
      Storage__S3__SecretAccessKey: trail-dev-secret

  mailpit:
    profiles: ["app"]
    image: axllent/mailpit
    ports:
      - "8025:8025"

  # S3-compatible object storage for attachments (console on http://localhost:9001).
  minio:
    profiles: ["app"]
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: trail-dev
      MINIO_ROOT_PASSWORD: trail-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - trail-minio:/data

  minio-init:
    profiles: ["app"]
    image: minio/mc
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 trail-dev trail-dev-secret; do sleep 1; done;
      mc mb --ignore-existing local/trail"

volumes:
  trail-mysql:
  trail-minio:
